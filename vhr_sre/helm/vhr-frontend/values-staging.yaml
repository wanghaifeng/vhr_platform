# Staging environment values
replicaCount: 2

image:
  tag: "staging"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

ingress:
  hosts:
    - host: vhr-staging.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: vhr-frontend-staging-tls
      hosts:
        - vhr-staging.example.com

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5

rollout:
  enabled: true
  strategy: canary
  canary:
    steps:
      - setWeight: 5
      - pause: { duration: 60s }
      - setWeight: 20
      - pause: { duration: 120s }
      - setWeight: 50
      - pause: { duration: 120s }
    analysis:
      enabled: true

istio:
  enabled: true
  host: vhr-staging.example.com
