{{- if and .Values.rollout.enabled (eq .Values.rollout.strategy "canary") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vhr-frontend.fullname" . }}-canary
  labels:
    {{- include "vhr-frontend.labels" . | nindent 4 }}
    role: canary
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "vhr-frontend.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vhr-frontend.fullname" . }}-stable
  labels:
    {{- include "vhr-frontend.labels" . | nindent 4 }}
    role: stable
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "vhr-frontend.selectorLabels" . | nindent 4 }}
{{- end }}
