{{- if and .Values.rollout.enabled (eq .Values.rollout.strategy "blueGreen") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.rollout.blueGreen.activeService | default (printf "%s-stable" (include "vhr-frontend.fullname" .)) }}
  labels:
    {{- include "vhr-frontend.labels" . | nindent 4 }}
    role: active
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "vhr-frontend.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.rollout.blueGreen.previewService | default (printf "%s-preview" (include "vhr-frontend.fullname" .)) }}
  labels:
    {{- include "vhr-frontend.labels" . | nindent 4 }}
    role: preview
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "vhr-frontend.selectorLabels" . | nindent 4 }}
{{- end }}
