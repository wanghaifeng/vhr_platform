{{- if .Values.rollout.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "vhr-frontend.fullname" . }}
  labels:
    {{- include "vhr-frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "vhr-frontend.selectorLabels" . | nindent 6 }}
  {{- if eq .Values.rollout.strategy "canary" }}
  strategy:
    canary:
      canaryService: {{ include "vhr-frontend.fullname" . }}-canary
      stableService: {{ include "vhr-frontend.fullname" . }}-stable
      {{- if .Values.istio.enabled }}
      trafficRouting:
        istio:
          virtualServices:
            - name: {{ include "vhr-frontend.fullname" . }}
              routes:
                - primary
      {{- end }}
      steps:
        {{- toYaml .Values.rollout.canary.steps | nindent 8 }}
      {{- if .Values.rollout.canary.analysis.enabled }}
      analysis:
        templates:
          {{- range .Values.rollout.canary.analysis.templates }}
          - templateName: {{ .name }}
          {{- end }}
        args:
          {{- range .Values.rollout.canary.analysis.args }}
          - name: {{ .name }}
            value: {{ .value }}
          {{- end }}
      {{- end }}
  {{- else if eq .Values.rollout.strategy "blueGreen" }}
  strategy:
    blueGreen:
      activeService: {{ .Values.rollout.blueGreen.activeService | default (printf "%s-stable" (include "vhr-frontend.fullname" .)) }}
      previewService: {{ .Values.rollout.blueGreen.previewService | default (printf "%s-preview" (include "vhr-frontend.fullname" .)) }}
      autoPromotionEnabled: {{ .Values.rollout.blueGreen.autoPromotionEnabled }}
      scaleDownDelayRevisionLimit: {{ .Values.rollout.blueGreen.scaleDownDelayRevisionLimit }}
      previewReplicaCount: {{ .Values.rollout.blueGreen.previewReplicaCount }}
      {{- if .Values.rollout.blueGreen.autoPromotionSeconds }}
      autoPromotionSeconds: {{ .Values.rollout.blueGreen.autoPromotionSeconds }}
      {{- end }}
  {{- end }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "vhr-frontend.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "vhr-frontend.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            {{- toYaml .Values.env | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
